name: Gerar APK do Lumpt
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: lumpt-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK na branch apk
        run: |
          mkdir -p /tmp/out && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/Lumpt.apk
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan apk && git rm -rfq . && cp /tmp/out/Lumpt.apk . && git add Lumpt.apk
          git commit -qm "APK do Lumpt" && git push -f origin apk
      - name: Publicar na página de Releases (download fácil)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-atual --cleanup-tag -y || true
          gh release create apk-atual /tmp/out/Lumpt.apk --target "$GITHUB_SHA" --title "Lumpt para Android (APK)" --notes "Baixe o arquivo Lumpt.apk, copie para o celular Android e abra. Versão de teste (debug). Gerado do commit ${GITHUB_SHA::7}."
